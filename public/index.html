<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#FFE500" />
    <meta
      name="description"
      content="Instant, barrier-free real-time room chat application with rich markdown, code sharing, and low-bandwidth optimization by RubbySoft."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Google Fonts: Outfit (Geometric Display) + Plus Jakarta Sans (Clean UI Body) + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
    <title>Rubby Room Chat — Instant Rooms, Realtime Messaging</title>

    <!-- Immediate theme check for instant loader theme matching -->
    <script>
      (function() {
        var isDark = localStorage.getItem('rrc_dark_mode') === 'dark';
        if (isDark) {
          document.documentElement.setAttribute('data-mode', 'dark');
        } else {
          document.documentElement.setAttribute('data-mode', 'light');
        }
      })();
    </script>

    <!-- CSS for Theme-Matched Neo-Brutalist Loader -->
    <style>
      #loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #fbf9f4;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        flex-direction: column;
        transition: opacity 0.25s ease, visibility 0.25s ease;
      }

      [data-mode='dark'] #loader {
        background-color: #0e1117;
      }

      .loader-card {
        background: #ffffff;
        border: 2.5px solid #121212;
        box-shadow: 4px 4px 0px #121212;
        border-radius: 16px;
        padding: 28px 36px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        animation: loaderCardPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      [data-mode='dark'] .loader-card {
        background: #1c222e;
        border: 2.5px solid #2d3648;
        box-shadow: 4px 4px 0px #06070a;
      }

      @keyframes loaderCardPop {
        from {
          opacity: 0;
          transform: scale(0.9) translateY(8px);
        }
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }

      /* Neo-Brutalist Bouncing Color Blocks */
      .loader-blocks {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .loader-block {
        width: 18px;
        height: 18px;
        border: 2px solid #121212;
        border-radius: 4px;
        box-shadow: 2px 2px 0px #121212;
        animation: blockBounce 0.7s ease-in-out infinite alternate;
      }

      [data-mode='dark'] .loader-block {
        box-shadow: 2px 2px 0px #000000;
      }

      .block-yellow {
        background: #FFE500;
        animation-delay: 0s;
      }

      .block-green {
        background: #00D084;
        animation-delay: 0.18s;
      }

      .block-pink {
        background: #FF5C7C;
        animation-delay: 0.36s;
      }

      @keyframes blockBounce {
        0% {
          transform: translateY(0);
        }
        100% {
          transform: translateY(-14px);
        }
      }

      .loader-text {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-size: 1.15rem;
        font-weight: 800;
        color: #121212;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      [data-mode='dark'] .loader-text {
        color: #f8fafc;
      }

      .loader-badge {
        background: #FFE500;
        color: #121212;
        border: 1.5px solid #121212;
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 0.8rem;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <!-- Theme-Matched Neo-Brutalist Loader HTML -->
    <div id="loader">
      <div class="loader-card">
        <div class="loader-blocks">
          <div class="loader-block block-yellow"></div>
          <div class="loader-block block-green"></div>
          <div class="loader-block block-pink"></div>
        </div>
        <div class="loader-text">
          Rubby<span class="loader-badge">ROOM</span>
        </div>
      </div>
    </div>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <script>
      window.addEventListener('load', function () {
        var loader = document.getElementById('loader');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(function () {
            loader.style.display = 'none';
          }, 250);
        }
      });
    </script>

  </body>
</html>
