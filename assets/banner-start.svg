<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050508" />
      <stop offset="50%" stop-color="#0b0a14" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>

    <!-- Neon Cyber Gradients -->
    <linearGradient id="pink-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e81cff" />
      <stop offset="50%" stop-color="#fc00ff" />
      <stop offset="100%" stop-color="#00dbde" />
    </linearGradient>

    <linearGradient id="cyan-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00dbde" />
      <stop offset="100%" stop-color="#40c9ff" />
    </linearGradient>
    
    <linearGradient id="pill-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e81cff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00dbde" stop-opacity="0.15" />
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="glow-strong" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="25" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Cyberpunk Grid Pattern -->
    <pattern id="cyber-grid" width="35" height="35" patternUnits="userSpaceOnUse">
      <path d="M 35 0 L 0 0 0 35" fill="none" stroke="#e81cff" stroke-width="0.7" stroke-opacity="0.08" />
      <circle cx="35" cy="35" r="1" fill="#00dbde" fill-opacity="0.2" />
    </pattern>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&amp;family=Montserrat:wght@500;700&amp;display=swap');

    .title {
      font-family: 'Orbitron', 'Montserrat', sans-serif;
      font-size: 54px;
      font-weight: 900;
      fill: url(#pink-cyan);
      letter-spacing: 4px;
      text-anchor: middle;
      filter: url(#glow-strong);
    }

    .subtitle {
      font-family: 'Montserrat', sans-serif;
      font-size: 16px;
      font-weight: 700;
      fill: #ffffff;
      letter-spacing: 6px;
      text-anchor: middle;
      opacity: 0.9;
    }

    .pill-text {
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      font-weight: 700;
      fill: #ffffff;
      letter-spacing: 1.5px;
      text-anchor: middle;
    }

    .status-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 700;
      fill: #00dbde;
      letter-spacing: 3px;
    }

    /* Animations */
    @keyframes pulse-border {
      0%, 100% { stroke-opacity: 0.8; filter: drop-shadow(0 0 8px #e81cff); }
      50% { stroke-opacity: 1; filter: drop-shadow(0 0 16px #00dbde); }
    }

    @keyframes float-slow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    @keyframes blink-dot {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 6px #00dbde); }
      50% { opacity: 0.2; }
    }

    @keyframes scanline {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(300%); }
    }

    .animated-border { animation: pulse-border 4s infinite ease-in-out; }
    .floating { animation: float-slow 5s infinite ease-in-out; }
    .blinking { animation: blink-dot 1.5s infinite ease-in-out; }
  </style>

  <!-- Main Background -->
  <rect width="994" height="274" x="3" y="3" rx="16" fill="url(#bg-grad)" stroke="url(#pink-cyan)" stroke-width="2.5" class="animated-border" />
  
  <!-- Cyber Grid Overlay -->
  <rect width="994" height="274" x="3" y="3" rx="16" fill="url(#cyber-grid)" />

  <!-- Corner Tech Accents -->
  <!-- Top Left -->
  <path d="M 15 45 L 15 15 L 45 15" fill="none" stroke="#00dbde" stroke-width="3" stroke-linecap="round" filter="url(#glow-cyan)" />
  <circle cx="22" cy="22" r="3" fill="#e81cff" />
  
  <!-- Top Right -->
  <path d="M 955 15 L 985 15 L 985 45" fill="none" stroke="#e81cff" stroke-width="3" stroke-linecap="round" filter="url(#glow-pink)" />
  <circle cx="978" cy="22" r="3" fill="#00dbde" />

  <!-- Bottom Left -->
  <path d="M 15 235 L 15 265 L 45 265" fill="none" stroke="#e81cff" stroke-width="3" stroke-linecap="round" filter="url(#glow-pink)" />
  <circle cx="22" cy="258" r="3" fill="#00dbde" />

  <!-- Bottom Right -->
  <path d="M 955 265 L 985 265 L 985 235" fill="none" stroke="#00dbde" stroke-width="3" stroke-linecap="round" filter="url(#glow-cyan)" />
  <circle cx="978" cy="258" r="3" fill="#e81cff" />

  <!-- Decorative Background Cyber Lines -->
  <line x1="80" y1="140" x2="180" y2="140" stroke="#e81cff" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 4" />
  <line x1="820" y1="140" x2="920" y2="140" stroke="#00dbde" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 4" />

  <g class="floating">
    <!-- Top Status Pill -->
    <g transform="translate(415, 30)">
      <rect width="170" height="26" rx="13" fill="#000000" fill-opacity="0.6" stroke="#00dbde" stroke-width="1" />
      <circle cx="20" cy="13" r="4.5" fill="#00dbde" class="blinking" />
      <text x="95" y="17" class="status-text" text-anchor="middle">SYSTEM ONLINE</text>
    </g>

    <!-- Main Title -->
    <text x="500" y="115" class="title">RUBBY ROOM CHAT</text>

    <!-- Subtitle -->
    <text x="500" y="160" class="subtitle">A MOBILE-FIRST CYBERPUNK CHAT APPLICATION</text>

    <!-- Bottom Feature Pills -->
    <!-- Pill 1: Real-Time Rooms -->
    <g transform="translate(140, 200)">
      <rect width="210" height="38" rx="8" fill="url(#pill-bg)" stroke="#e81cff" stroke-width="1.5" filter="url(#glow-pink)" />
      <text x="105" y="24" class="pill-text">⚡ INSTANT ROOMS</text>
    </g>

    <!-- Pill 2: Gemini AI -->
    <g transform="translate(395, 200)">
      <rect width="210" height="38" rx="8" fill="url(#pill-bg)" stroke="#00dbde" stroke-width="1.5" filter="url(#glow-cyan)" />
      <text x="105" y="24" class="pill-text">🤖 GOOGLE GEMINI AI</text>
    </g>

    <!-- Pill 3: RubbySoft -->
    <g transform="translate(650, 200)">
      <rect width="210" height="38" rx="8" fill="url(#pill-bg)" stroke="#fc00ff" stroke-width="1.5" filter="url(#glow-pink)" />
      <text x="105" y="24" class="pill-text">🔥 BY RUBBYSOFT</text>
    </g>
  </g>
</svg>
