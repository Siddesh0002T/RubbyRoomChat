<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 160" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad-footer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050508" />
      <stop offset="50%" stop-color="#0b0a14" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>

    <!-- Neon Cyber Gradients -->
    <linearGradient id="cyan-pink-footer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00dbde" />
      <stop offset="50%" stop-color="#40c9ff" />
      <stop offset="100%" stop-color="#e81cff" />
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="glow-footer" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Cyberpunk Grid Pattern -->
    <pattern id="cyber-grid-footer" width="35" height="35" patternUnits="userSpaceOnUse">
      <path d="M 35 0 L 0 0 0 35" fill="none" stroke="#00dbde" stroke-width="0.6" stroke-opacity="0.07" />
      <circle cx="35" cy="35" r="1" fill="#e81cff" fill-opacity="0.2" />
    </pattern>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&amp;family=Montserrat:wght@500;700&amp;display=swap');

    .footer-title {
      font-family: 'Orbitron', 'Montserrat', sans-serif;
      font-size: 32px;
      font-weight: 900;
      fill: url(#cyan-pink-footer);
      letter-spacing: 3px;
      text-anchor: middle;
      filter: url(#glow-footer);
    }

    .footer-sub {
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      font-weight: 700;
      fill: #ffffff;
      letter-spacing: 4px;
      text-anchor: middle;
      opacity: 0.85;
    }

    .footer-dev {
      font-family: 'Montserrat', sans-serif;
      font-size: 12px;
      font-weight: 500;
      fill: #00dbde;
      letter-spacing: 2px;
      text-anchor: middle;
    }

    /* Animations */
    @keyframes pulse-border-footer {
      0%, 100% { stroke-opacity: 0.7; filter: drop-shadow(0 0 6px #00dbde); }
      50% { stroke-opacity: 1; filter: drop-shadow(0 0 14px #e81cff); }
    }

    @keyframes float-footer {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }

    .animated-footer-border { animation: pulse-border-footer 4s infinite ease-in-out; }
    .floating-footer { animation: float-footer 5s infinite ease-in-out; }
  </style>

  <!-- Main Background -->
  <rect width="994" height="154" x="3" y="3" rx="14" fill="url(#bg-grad-footer)" stroke="url(#cyan-pink-footer)" stroke-width="2" class="animated-footer-border" />
  
  <!-- Cyber Grid Overlay -->
  <rect width="994" height="154" x="3" y="3" rx="14" fill="url(#cyber-grid-footer)" />

  <!-- Corner Tech Accents -->
  <!-- Top Left -->
  <path d="M 15 35 L 15 15 L 35 15" fill="none" stroke="#e81cff" stroke-width="2.5" stroke-linecap="round" />
  <!-- Bottom Right -->
  <path d="M 965 145 L 985 145 L 985 125" fill="none" stroke="#00dbde" stroke-width="2.5" stroke-linecap="round" />

  <!-- Decorative Side Bars -->
  <rect x="30" y="70" width="40" height="3" rx="1.5" fill="#e81cff" fill-opacity="0.6" />
  <rect x="930" y="70" width="40" height="3" rx="1.5" fill="#00dbde" fill-opacity="0.6" />

  <g class="floating-footer">
    <!-- Main Footer Text -->
    <text x="500" y="60" class="footer-title">THANK YOU FOR VISITING!</text>

    <!-- Subtitle -->
    <text x="500" y="95" class="footer-sub">BUILDING THE FUTURE OF REAL-TIME CHAT &amp; AI</text>

    <!-- Developers -->
    <text x="500" y="128" class="footer-dev">DEVELOPED WITH ❤️ BY SIDDHESH MORE &amp; YUVRAJ CHAUDHARI • RUBBYSOFT</text>
  </g>
</svg>
